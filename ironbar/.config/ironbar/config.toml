anchor_to_edges = true
position = "top"
layer = "top"
height = 40
exclusive_zone = true
name = "topbar"

[[start]]
type = "clock"
format = "%l:%M %P"
format_popup = "%a,%-eth"

[[start]]
type = "music"
player_type = "mpris"

[[center]]
type = "focused"
show_icon = true
icon_size = 24

[center.truncate]
mode="end"
length=60

[[end]]
type = "volume"
format = "vol:{percentage}%"
max_volume = 150

[end.icons]
volume_high = "󰕾"
volume_medium = "󰖀"
volume_low = "󰕿"
muted = "󰝟"

[[end]]
type = "clipboard"
label = "󰨸"
max_items = 3

[end.truncate]
mode = "end"
length = 64

[[end]]
type = "battery"
format = "bat: {percentage}%"
show_icon = false

[[end]]
type = "custom"
class = "power-menu"
tooltip = "Up: {{30000:uptime -p | cut -d ' ' -f2-}}"

[[end.bar]]
type = "button"
name = "power-btn"
label = "󰤂"
on_click = "popup:toggle"

[[end.popup]]
type = "box"
orientation = "vertical"


[[end.popup.widgets]]
type = "box"

[[end.popup.widgets.widgets]]
type = "button"
class = "power-btn"
label = "<span font-size='24pt'>󰐥</span>"
on_click = "!shutdown now"

[[end.popup.widgets.widgets]]
type = "button"
class = "power-btn"
label = "<span font-size='24pt'>󰜉</span>"
on_click = "!reboot"
